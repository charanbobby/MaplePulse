services:
  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    env_file:
      - .env

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
      - ./.env:/app/.env:ro
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_LANGFUSE_HOST=https://us.cloud.langfuse.com
      - NEXT_PUBLIC_LANGFUSE_PROJECT_ID=cmmrsvbva04hnad07a4cds6ku
    env_file:
      - .env
    depends_on:
      - backend
